# Modern weapons added by Gopyr's mod
# Long-range infantry weapons

M24Sniper:
	Inherits: ^LightMG
	ReloadDelay: 50
	Range: 8c0
	Report: sniper.aud
	Burst: 1
	Warhead@1Dam: SpreadDamage
		Spread: 64
		Versus:
			None: 100
			Wood: 25
			Light: 15
			Heavy: 5
	Warhead@2Eff: CreateEffect
		Explosions: sniperhit
		ImpactSounds: sniper.aud
		InvalidTargets: Vehicle, Structure

