# CGNMissile - ship-launched long-range cruise/artillery missile (hits land + sea)
CGNMissile:
	Inherits: ^AntiGroundMissile
	ReloadDelay: 150
	Range: 12c0
	MinRange: 3c0
	Report: missile1.aud
	Projectile: Bullet
		Speed: 240
		Blockable: false
		TrailImage: smokey
		TrailDelay: 4
		Inaccuracy: 170
		Image: MISSILE
		Shadow: True
		LaunchAngle: 90
	Warhead@1Dam: SpreadDamage
		Spread: 341
		Damage: 3000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: GroundActor, WaterActor, Water, Underwater, Trees
		Versus:
			None: 90
			Wood: 75
			Tree: 75
			Light: 80
			Heavy: 70
			Concrete: 100
		DamageTypes: Prone50Percent, TriggerProne, SmallExplosionDeath, Incendiary
	Warhead@3Eff: CreateEffect
		Explosions: napalm
		ImpactSounds: firebl3.aud
	Warhead@4EffWater: CreateEffect
		Explosions: large_splash

