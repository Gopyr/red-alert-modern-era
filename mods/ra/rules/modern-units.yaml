# Modern Units roster - Gopyr's OpenRA mod additions
# Modern-themed tanks, artillery and ships with custom PNG sprites.
#
# Each unit uses its own generated PNG pixel-art (8 facings body + turret)
# so they no longer reuse classic RA sprites.

#########################################
#  MODERN TANKS
#########################################

# M1 Abrams-class main battle tank.
MBT:
	Inherits: 3TNK
	RenderSprites:
		Image: mbt
	Buildable:
		BuildPaletteOrder: 230
		Prerequisites: fix, ~vehicles.allies, ~techlevel.high
		Description: actor-mbt.description
	Valued:
		Cost: 1750
	Tooltip:
		Name: actor-mbt.name
		GenericName: actor-mbt.generic-name
	Health:
		HP: 75000
	Mobile:
		Speed: 76

