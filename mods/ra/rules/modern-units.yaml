# Modern Units roster - Gopyr's OpenRA mod additions
# Adds modern-themed tank and ship variants by reusing existing sprites
# with distinct roles, names and statistics. All actors inherit from
# original RA units so they remain fully functional and load cleanly.
#
# NOTE: These units reuse original RA sprites. They look like the base
# vehicle but fill a distinct, stronger role (higher tier / modern naming).

#########################################
#  MODERN TANKS
#########################################

# M1 Abrams-class main battle tank. Upgrade of the Soviet Heavy Tank.
MBT:
	Inherits: 3TNK
	RenderSprites:
		Image: 3tnk
	Buildable:
		BuildPaletteOrder: 230
		Prerequisites: fix, ~vehicles.allies, ~techlevel.high
		Description: actor-mbt.description
	Valued:
		Cost: 1750
	Tooltip:
		Name: actor-mbt.name
		GenericName: actor-mbt.generic-name
	Health:
		HP: 75000
	Mobile:
		Speed: 76

