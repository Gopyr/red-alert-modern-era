# Modern nuclear-powered warships - multi-attack variants (Docks tier 3)
# Nuclear = top-tier: higher cost, speed, HP, faster reload, self-sustaining endurance.

# DDN - Nuclear Destroyer (Arleigh Burke-class AEGIS)
# Multi-attack: naval gun (Stinger) + anti-sub combat system (DepthCharge) + air-defense missiles (StingerAA)
DDN:
	Inherits: DD
	RenderSprites:
		Image: dd
	Buildable:
		Queue: Ship
		BuildPaletteOrder: 85
		Prerequisites: ~syrd, atek, dome, ~techlevel.high
		Description: actor-ddn.description
	Valued:
		Cost: 2200
	Tooltip:
		Name: actor-ddn.name
		GenericName: actor-ddn.generic-name
	Health:
		HP: 55000
	Mobile:
		TurnSpeed: 32
		Speed: 105
	Armament@PRIMARY:
		Weapon: Stinger
		LocalOffset: 0,-100,0, 0,100,0
		LocalYaw: 64, -64
	Armament@SECONDARY:
		Weapon: DepthCharge
		LocalOffset: 0,-100,0, 0,100,0
		LocalYaw: 80, -80
	Armament@TERTIARY:
		Weapon: StingerAA
		LocalOffset: 0,-100,0, 0,100,0
		LocalYaw: 64, -64

# CGN - Nuclear Guided-Missile Cruiser (Ticonderoga-class)
# Multi-attack: twin cannon (8Inch) + long-range strike missile (20c) + air-defense (StingerAA)
CGN:
