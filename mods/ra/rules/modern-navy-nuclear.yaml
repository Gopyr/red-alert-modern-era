		Description: actor-cgn.description
	Valued:
		Cost: 3000
	Tooltip:
		Name: actor-cgn.name
		GenericName: actor-cgn.generic-name
	Health:
		HP: 80000
	Mobile:
		TurnSpeed: 30
		Speed: 88
	Armament@PRIMARY:
		Weapon: 8Inch
		LocalOffset: 0,-75,0, 0,75,0
	Armament@SECONDARY:
		Weapon: 8Inch
		LocalOffset: 0,-75,0, 0,75,0
	Armament@TERTIARY:
		Weapon: CGNMissile
		LocalOffset: 0,-100,0, 0,100,0
	Armament@QUATERNARY:
		Weapon: StingerAA
		LocalOffset: 0,-100,0, 0,100,0
	AttackTurreted:

