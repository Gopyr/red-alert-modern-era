# Legendary armor commander. Units in his aura take 20% less damage.
GENPATTON:
	Inherits: E1
	RenderSprites:
		Image: genpatton
	Buildable:
		Queue: Infantry
		BuildPaletteOrder: 90
		Prerequisites: tent, ~techlevel.high
		Description: actor-genpatton.description
	Valued:
		Cost: 2500
	Tooltip:
		Name: actor-genpatton.name
		GenericName: actor-genpatton.generic-name
	Health:
		HP: 30000
	Mobile:
		Speed: 70
	Armament:
		Weapon: M1Carbine
	ProximityExternalCondition@DEFENSE_BOOST:
		Range: 6c0
		ValidRelationships: Ally
		Condition: defense-boost
	InstantlyRepairable:
	WithRangeCircle:
		Range: 6c0
		Color: 00FF0080
	RenderRangeCircle:

